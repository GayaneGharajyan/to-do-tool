            <div class="column" data-column="2" ondragover="handleDragOver(event)" ondrop="handleDrop(event)" ondragleave="handleDragLeave(event)">
                <h2 class="column-title">backlog</h2>
                <div class="input-container">
                    <input 
                        type="text" 
                        class="task-input" 
                        data-column="2"
                        placeholder="Add a new task..."
                        autocomplete="off"
                    >
                    <button class="add-btn" onclick="addTask(2)">Add</button>
                </div>
                <ul class="task-list" data-column="2"></ul>
            </div>
        </div>
    </div>

    <script>
        // Load and set custom title from localStorage
        const savedTitle = localStorage.getItem('customTitle');
        if (savedTitle) {
            document.getElementById('main-title').innerHTML = savedTitle;
        }

        // Load custom Elmo image from localStorage
        const savedElmoImage = localStorage.getItem('customElmoImage');
        if (savedElmoImage) {
            document.getElementById('elmo-image').src = savedElmoImage;
        }

        // Handle Elmo image upload
        function handleElmoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (!file.type.startsWith('image/')) {
                alert('Please select an image file');
                event.target.value = '';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const imageData = e.target.result;
                document.getElementById('elmo-image').src = imageData;
                localStorage.setItem('customElmoImage', imageData);
            };
            reader.readAsDataURL(file);
            event.target.value = ''; // Reset input
        }

        // Remove Elmo
        function removeElmo() {
            const elmoWrapper = document.getElementById('elmo-wrapper');
            const restoreBtn = document.getElementById('restore-elmo-btn');
            
            if (elmoWrapper) elmoWrapper.classList.add('hidden');
            if (restoreBtn) restoreBtn.classList.remove('hidden');
            
            localStorage.setItem('elmoHidden', 'true');
        }

        // Restore Elmo
        function restoreElmo() {
            const elmoWrapper = document.getElementById('elmo-wrapper');
            const restoreBtn = document.getElementById('restore-elmo-btn');
            
            if (elmoWrapper) elmoWrapper.classList.remove('hidden');
            if (restoreBtn) restoreBtn.classList.add('hidden');
            
            localStorage.removeItem('elmoHidden');
        }

        // Load Elmo size on page load
        const savedElmoSize = JSON.parse(localStorage.getItem('elmoSize'));
        const elmoImgEl = document.getElementById('elmo-image');
        if (savedElmoSize && elmoImgEl) {
            elmoImgEl.style.width = savedElmoSize.width;
        }

        // Elmo resize handle functionality
        (function() {
            const resizeHandle = document.getElementById('elmo-resize-handle');
            const elmoImg = document.getElementById('elmo-image');
            if (!resizeHandle || !elmoImg) return;

            let isResizing = false;
            let startX, startWidth;

            resizeHandle.addEventListener('mousedown', function(e) {
                // Don't resize on mobile
                if (window.innerWidth <= 768) return;
                
                e.preventDefault();
                e.stopPropagation();
                isResizing = true;
                startX = e.clientX;
                startWidth = elmoImg.offsetWidth;
                document.body.style.cursor = 'se-resize';
            });

            document.addEventListener('mousemove', function(e) {
                if (!isResizing) return;
                
                const deltaX = e.clientX - startX;
                const newWidth = Math.max(40, Math.min(300, startWidth + deltaX));
                elmoImg.style.width = newWidth + 'px';
            });

            document.addEventListener('mouseup', function() {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.cursor = '';
                    // Save the new size
                    localStorage.setItem('elmoSize', JSON.stringify({
                        width: elmoImg.style.width
                    }));
                }
            });
        })();

        const elmoHidden = localStorage.getItem('elmoHidden');
        if (elmoHidden === 'true') {
            document.getElementById('elmo-wrapper').classList.add('hidden');
            document.getElementById('restore-elmo-btn').classList.remove('hidden');
        }

        // Make functions globally available
        window.handleElmoUpload = handleElmoUpload;
        window.removeElmo = removeElmo;
        window.restoreElmo = restoreElmo;

        // Load and set saved container size (desktop only)
        const savedContainerSize = JSON.parse(localStorage.getItem('containerSize'));
        const containerEl = document.querySelector('.container');
        if (savedContainerSize && containerEl && window.innerWidth > 768) {
            if (savedContainerSize.width) containerEl.style.width = savedContainerSize.width;
            if (savedContainerSize.height) containerEl.style.height = savedContainerSize.height;
        }

        // Save container size when resized (desktop only)
        if (containerEl && window.innerWidth > 768) {
            let resizeTimeout;
            const resizeObserver = new ResizeObserver((entries) => {
                // Debounce to avoid saving too frequently
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    // Only save on desktop
                    if (window.innerWidth > 768) {
                        const rect = containerEl.getBoundingClientRect();
                        localStorage.setItem('containerSize', JSON.stringify({
                            width: rect.width + 'px',
                            height: rect.height + 'px'
                        }));
                    }
                }, 100);
            });
            resizeObserver.observe(containerEl);
        }

        // Draggable Elmo wrapper
        (function() {
            const elmoWrapper = document.querySelector('.elmo-wrapper');
            const elmoImg = document.querySelector('.elmo-image');
            if (!elmoWrapper || !elmoImg) return;
            
            let dragging = false;
            let offsetX = 0, offsetY = 0;
            
            // Load saved position (only on desktop)
            const saved = localStorage.getItem('elmoPosition');
            if (saved && window.innerWidth > 768) {
                const pos = JSON.parse(saved);
                elmoWrapper.style.position = 'fixed';
                elmoWrapper.style.left = pos.x + 'px';
                elmoWrapper.style.top = pos.y + 'px';
                elmoWrapper.style.zIndex = '9999';
                elmoWrapper.style.margin = '0';
            }
            
            elmoImg.onmousedown = function(e) {
                // Don't start drag if clicking on upload button
                if (e.target.closest('.elmo-upload-btn')) return;
                
                // Don't drag on mobile - let touch scroll work
                if (window.innerWidth <= 768) return;
                
                e.preventDefault();
                dragging = true;
                
                const rect = elmoWrapper.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                
                elmoWrapper.style.position = 'fixed';
                elmoWrapper.style.left = rect.left + 'px';
                elmoWrapper.style.top = rect.top + 'px';
                elmoWrapper.style.zIndex = '9999';
                elmoWrapper.style.margin = '0';
                elmoImg.classList.add('dragging');
            };
            
            document.addEventListener('mousemove', function(e) {
                if (!dragging) return;
                elmoWrapper.style.left = (e.clientX - offsetX) + 'px';
                elmoWrapper.style.top = (e.clientY - offsetY) + 'px';
            });
            
            document.addEventListener('mouseup', function() {
                if (dragging) {
                    dragging = false;
                    elmoImg.classList.remove('dragging');
                    localStorage.setItem('elmoPosition', JSON.stringify({
                        x: parseInt(elmoWrapper.style.left),
                        y: parseInt(elmoWrapper.style.top)
                    }));
                }
            });
            
            elmoImg.title = 'Drag to move';
        })();

        // Draggable title
        (function() {
            const title = document.getElementById('main-title');
            if (!title) return;
            
            let dragging = false;
            let offsetX = 0, offsetY = 0;
            let hasMoved = false;
            
            // Load saved position (only on desktop)
            const saved = localStorage.getItem('titlePosition');
            if (saved && window.innerWidth > 768) {
                const pos = JSON.parse(saved);
                title.style.position = 'fixed';
                title.style.left = pos.x + 'px';
                title.style.top = pos.y + 'px';
                title.style.zIndex = '9998';
                title.style.margin = '0';
            }
            
            title.addEventListener('mousedown', function(e) {
                // Don't drag on mobile - let touch scroll work
                if (window.innerWidth <= 768) return;
                
                e.preventDefault();
                dragging = true;
                hasMoved = false;
                
                const rect = title.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                
                title.style.position = 'fixed';
                title.style.left = rect.left + 'px';
                title.style.top = rect.top + 'px';
                title.style.zIndex = '9998';
                title.style.margin = '0';
                title.classList.add('dragging');
            });
            
            document.addEventListener('mousemove', function(e) {
                if (!dragging) return;
                hasMoved = true;
                title.style.left = (e.clientX - offsetX) + 'px';
                title.style.top = (e.clientY - offsetY) + 'px';
            });
            
            document.addEventListener('mouseup', function() {
                if (dragging) {
                    dragging = false;
                    title.classList.remove('dragging');
                    
                    // Only save if moved
                    if (hasMoved) {
                        localStorage.setItem('titlePosition', JSON.stringify({
                            x: parseInt(title.style.left),
                            y: parseInt(title.style.top)
                        }));
                    }
                }
            });
            
            // Click to edit (only if didn't drag)
            title.addEventListener('click', function(e) {
                if (!hasMoved) {
                    editTitle();
                }
            });
            
            // Remove the old onclick handler
            title.removeAttribute('onclick');
            
            title.title = 'Drag to move • Click to edit';
        })();

        // Function to edit the title
        function editTitle() {
            const titleElement = document.getElementById('main-title');
            if (!titleElement) return;
            
            // Check if already in edit mode
            if (document.querySelector('.title-edit')) return;
            
            // Convert <br> to newlines for editing
            const currentTitle = titleElement.innerHTML.replace(/<br\s*\/?>/gi, '\n');
            
            // Create textarea for multi-line editing
            const textarea = document.createElement('textarea');
            textarea.className = 'title-edit';
            textarea.value = currentTitle;
            textarea.rows = 2;
            
            // Replace h1 with textarea
            titleElement.style.display = 'none';
            titleElement.parentNode.insertBefore(textarea, titleElement);
            textarea.focus();
            textarea.select();
            
            // Save on blur
            textarea.addEventListener('blur', () => {
                saveTitleEdit(textarea.value);
            });
            
            // Ctrl+Enter to save, Escape to cancel
            textarea.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    textarea.blur();
                }
                if (e.key === 'Escape') {
                    cancelTitleEdit();
                }
            });
        }

        // Function to save title edit
        function saveTitleEdit(newTitle) {
            const titleElement = document.getElementById('main-title');
            const textarea = document.querySelector('.title-edit');
            
            if (!titleElement || !textarea) return;
            
            const trimmedTitle = newTitle.trim();
            if (trimmedTitle === '') {
                // Restore default if empty
                titleElement.innerHTML = "Gayane's<br>working items";
                localStorage.removeItem('customTitle');
            } else {
                // Convert newlines to <br> tags for display
                const htmlTitle = trimmedTitle.replace(/\n/g, '<br>');
                titleElement.innerHTML = htmlTitle;
                localStorage.setItem('customTitle', htmlTitle);
            }
            
            textarea.remove();
            titleElement.style.display = '';
        }

        // Function to cancel title edit
        function cancelTitleEdit() {
            const titleElement = document.getElementById('main-title');
            const input = document.querySelector('.title-edit');
            
            if (input) input.remove();
            if (titleElement) titleElement.style.display = '';
        }

        // Load tasks from localStorage on page load - 3 columns
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [[], [], []];
        
        // Ensure tasks is always an array with 3 columns
        if (!Array.isArray(tasks) || tasks.length !== 3) {
            tasks = [[], [], []];
        }
        
        // Ensure each column is an array and each task has comments
        for (let i = 0; i < 3; i++) {
            if (!Array.isArray(tasks[i])) {
                tasks[i] = [];
            }
            // Ensure each task has a comments array
            tasks[i].forEach(task => {
                if (task && !task.comments) {
                    task.comments = [];
                }
            });
        }

        // Helper function to get week identifier and label from timestamp
        function getWeekInfo(timestamp) {
            if (!timestamp) return { key: 'unknown', label: 'Completed' };
            
            const date = new Date(timestamp);
            const now = new Date();
            
            // Get the Monday of the week for the given date
            const dayOfWeek = date.getDay();
            const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            const monday = new Date(date);
            monday.setDate(date.getDate() + mondayOffset);
            monday.setHours(0, 0, 0, 0);
            
            // Get Monday of current week
            const currentDayOfWeek = now.getDay();
            const currentMondayOffset = currentDayOfWeek === 0 ? -6 : 1 - currentDayOfWeek;
            const currentMonday = new Date(now);
            currentMonday.setDate(now.getDate() + currentMondayOffset);
            currentMonday.setHours(0, 0, 0, 0);
            
            // Calculate week difference
            const weekDiff = Math.floor((currentMonday - monday) / (7 * 24 * 60 * 60 * 1000));
            
            // Create unique key for the week
            const weekKey = `${monday.getFullYear()}-W${String(Math.ceil((monday.getDate() + 1) / 7)).padStart(2, '0')}-${monday.getMonth()}`;
            
            // Create human-readable label
            let label;
            if (weekDiff === 0) {
                label = 'This Week';
            } else {
                // Show date range for all past weeks
                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);
                const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                label = `${monthNames[monday.getMonth()]} ${monday.getDate()} - ${monthNames[sunday.getMonth()]} ${sunday.getDate()}`;
            }
            
            return { key: weekKey, label: label };
        }

        // Function to convert URLs in text to clickable links
        function linkifyText(text) {
            // URL pattern that matches http, https, and www links
            const urlPattern = /(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi;
            return text.replace(urlPattern, (url) => {
                const href = url.startsWith('www.') ? 'https://' + url : url;
                return `<a href="${href}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${url}</a>`;
            });
        }

        // Export functions
        function exportToCSV() {
            const columnNames = ['Working on this now', 'To do next', 'Done'];
            let csvContent = 'Column,Task,Status,Completed Date,Comments\n';
            
            tasks.forEach((columnTasks, columnIndex) => {
                columnTasks.forEach(task => {
                    const column = columnNames[columnIndex];
                    const taskText = task.text.replace(/"/g, '""'); // Escape quotes
                    const status = task.completed ? 'Completed' : 'Pending';
                    const completedDate = task.completedAt ? new Date(task.completedAt).toLocaleDateString() : '';
                    const comments = (task.comments || []).map(c => c.text.replace(/"/g, '""')).join(' | ');
                    
                    csvContent += `"${column}","${taskText}","${status}","${completedDate}","${comments}"\n`;
                });
            });
            
            // Create and download the file using data URI (works better with local files)
            const link = document.createElement('a');
            link.setAttribute('href', 'data:text/csv;charset=utf-8,' + encodeURIComponent(csvContent));
            link.setAttribute('download', `todo-list-${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function exportToPDF() {
            // Create a new window with formatted content for printing
            const columnNames = ['Working on this now', 'To do next', 'Done'];
            const title = document.getElementById('main-title').innerHTML.replace(/<br>/g, ' ');
            
            let htmlContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>${title} - Export</title>
                    <style>
                        body {
                            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                            padding: 20px;
                            max-width: 800px;
                            margin: 0 auto;
                        }
                        h1 {
                            text-align: center;
                            color: #333;
                            border-bottom: 2px solid #ccb000;
                            padding-bottom: 10px;
                        }
                        h2 {
                            color: #555;
                            margin-top: 25px;
                            font-size: 1.2em;
                            border-left: 4px solid #ccb000;
                            padding-left: 10px;
                        }
                        .task {
                            padding: 8px 12px;
                            margin: 5px 0;
                            background: #f5f5f5;
                            border-radius: 5px;
                        }
                        .task.completed {
                            text-decoration: line-through;
                            color: #888;
                        }
                        .comment {
                            font-size: 0.85em;
                            color: #666;
                            margin-left: 20px;
                            font-style: italic;
                        }
                        .date {
                            font-size: 0.8em;
                            color: #999;
                        }
                        .export-date {
                            text-align: center;
                            color: #999;
                            font-size: 0.9em;
                            margin-bottom: 20px;
                        }
                    </style>
                </head>
                <body>
                    <h1>${title}</h1>
                    <p class="export-date">Exported on ${new Date().toLocaleDateString()} at ${new Date().toLocaleTimeString()}</p>
            `;
            
            tasks.forEach((columnTasks, columnIndex) => {
                htmlContent += `<h2>${columnNames[columnIndex]} (${columnTasks.length})</h2>`;
                
                if (columnTasks.length === 0) {
                    htmlContent += '<p style="color: #999; font-style: italic;">No tasks</p>';
                } else {
                    columnTasks.forEach(task => {
                        const completedClass = task.completed ? 'completed' : '';
                        const completedDate = task.completedAt ? 
                            ` <span class="date">(${new Date(task.completedAt).toLocaleDateString()})</span>` : '';
                        
                        htmlContent += `<div class="task ${completedClass}">${task.text}${completedDate}</div>`;
                        
                        if (task.comments && task.comments.length > 0) {
                            task.comments.forEach(comment => {
                                htmlContent += `<div class="comment">↳ ${comment.text}</div>`;
                            });
                        }
                    });
                }
            });
            
            htmlContent += `
                </body>
                </html>
            `;
            
            // Open print window
            const printWindow = window.open('', '_blank');
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            printWindow.onload = function() {
                printWindow.print();
            };
        }

        // Function to render tasks for a specific column
        function renderTasks(columnIndex) {
            const taskList = document.querySelector(`.task-list[data-column="${columnIndex}"]`);
            if (!taskList) {
                console.error('Task list not found for column:', columnIndex);
                return;
            }
            
            taskList.innerHTML = '';
            
            // Ensure the column array exists
            if (!tasks[columnIndex]) {
                tasks[columnIndex] = [];
            }
            
            const columnTasks = tasks[columnIndex];
            
            if (!columnTasks || columnTasks.length === 0) {
                taskList.innerHTML = `
                    <div class="empty-state">
                        <p>✨ No tasks yet</p>
                    </div>
                `;
            } else {
                // Create a map of tasks to their original indices
                const taskToIndex = new Map();
                columnTasks.forEach((task, index) => {
                    taskToIndex.set(task, index);
                });
                
                // Sort tasks: incomplete first, completed at the bottom
                // Completed tasks sorted by completedAt (most recent first)
                const sortedTasks = [...columnTasks].sort((a, b) => {
                    if (a.completed === b.completed) {
                        if (a.completed) {
                            // Both completed: sort by completedAt descending (most recent first)
                            const aTime = a.completedAt || 0;
                            const bTime = b.completedAt || 0;
                            return bTime - aTime;
                        }
                        // Both incomplete: maintain original order
                        return taskToIndex.get(a) - taskToIndex.get(b);
                    }
                    return a.completed ? 1 : -1; // Incomplete first
                });
                
                let lastWeekKey = null;
                let isFirstCompleted = true;
                
                sortedTasks.forEach((task) => {
                    // Get original index from the map
                    const originalIndex = taskToIndex.get(task);
                    
                    // Add week separator for completed tasks when week changes
                    if (task.completed && task.completedAt) {
                        const weekInfo = getWeekInfo(task.completedAt);
                        if (weekInfo.key !== lastWeekKey) {
                            const separator = document.createElement('li');
                            separator.className = 'week-separator';
                            separator.innerHTML = `<span class="week-separator-text">✓ ${weekInfo.label}</span>`;
                            taskList.appendChild(separator);
                            lastWeekKey = weekInfo.key;
                        }
                        isFirstCompleted = false;
                    } else if (task.completed && !task.completedAt && isFirstCompleted) {
                        // For completed tasks without timestamp (legacy), show generic separator once
                        const separator = document.createElement('li');
                        separator.className = 'week-separator';
                        separator.innerHTML = `<span class="week-separator-text">✓ Completed</span>`;
                        taskList.appendChild(separator);
                        lastWeekKey = 'legacy';
                        isFirstCompleted = false;
                    }
                    
                    const li = document.createElement('li');
                    li.className = `task-item ${task.completed ? 'completed' : ''}`;
                    li.draggable = true;
                    li.setAttribute('data-column', columnIndex);
                    li.setAttribute('data-index', originalIndex);
                    
                    // Ensure task has comments array
                    if (!task.comments) {
                        task.comments = [];
                    }
                    
                    const commentCount = task.comments.length;
                    const commentCountBadge = commentCount > 0 ? `<span class="comment-count">${commentCount}</span>` : '';
                    
                    // Only show checkbox for first column (columnIndex === 0)
                    const checkboxHtml = columnIndex === 0 
                        ? `<input 
                            type="checkbox" 
                            class="task-checkbox" 
                            ${task.completed ? 'checked' : ''}
                            onchange="toggleTask(${columnIndex}, ${originalIndex})"
                        >`
                        : '';
                    
                    li.innerHTML = `
                        <div class="task-item-header">
                            <div class="task-item-content">
                                ${checkboxHtml}
                                <span class="task-text" onclick="editTask(${columnIndex}, ${originalIndex})">${linkifyText(task.text)}</span>
                            </div>
                            <div class="task-actions">
                                <button class="delete-btn" onclick="deleteTask(${columnIndex}, ${originalIndex})" style="width: 29px; height: 22px; min-width: 29px; min-height: 22px; max-width: 29px; max-height: 22px; padding: 4px; box-sizing: border-box;" title="Delete">×</button>
                                <button class="comments-btn" onclick="toggleComments(${columnIndex}, ${originalIndex})" title="Comments">
                                    💬${commentCountBadge}
                                </button>
                            </div>
                        </div>
                        <div class="comments-section" id="comments-${columnIndex}-${originalIndex}">
                            <div class="comments-list" id="comments-list-${columnIndex}-${originalIndex}">
                                ${renderComments(task.comments, columnIndex, originalIndex)}
                            </div>
                            <div class="comment-input-container">
                                <input 
                                    type="text" 
                                    class="comment-input" 
                                    id="comment-input-${columnIndex}-${originalIndex}"
                                    placeholder="Add a comment..."
                                    onkeypress="if(event.key==='Enter') addComment(${columnIndex}, ${originalIndex})"
                                >
                                <input 
                                    type="file" 
                                    class="comment-file-input" 
                                    id="comment-image-${columnIndex}-${originalIndex}"
                                    accept="image/*"
                                    onchange="handleImageSelect(${columnIndex}, ${originalIndex}, event)"
                                >
                                <label for="comment-image-${columnIndex}-${originalIndex}" class="comment-file-label" title="Add image">📷</label>
                                <button class="comment-add-btn" onclick="addComment(${columnIndex}, ${originalIndex})">Add</button>
                            </div>
                        </div>
                    `;
                    
                    // Drag event handlers
                    li.addEventListener('dragstart', handleDragStart);
                    li.addEventListener('dragend', handleDragEnd);
                    li.addEventListener('dragover', handleTaskDragOver);
                    li.addEventListener('drop', handleTaskDrop);
                    li.addEventListener('dragleave', handleTaskDragLeave);
                    
                    // Paste event handler for images
                    const commentInput = li.querySelector(`#comment-input-${columnIndex}-${originalIndex}`);
                    const commentContainer = li.querySelector(`#comments-${columnIndex}-${originalIndex}`);
                    if (commentInput) {
                        commentInput.addEventListener('paste', (e) => handlePasteImage(e, columnIndex, originalIndex));
                    }
                    if (commentContainer) {
                        commentContainer.addEventListener('paste', (e) => handlePasteImage(e, columnIndex, originalIndex));
                    }
                    
                    taskList.appendChild(li);
                });
            }
        }

        // Function to render all columns
        function renderAllTasks() {
            renderTasks(0);
            renderTasks(1);
            renderTasks(2);
        }

        // Function to add a new task to a specific column
        function addTask(columnIndex) {
            const taskInput = document.querySelector(`.task-input[data-column="${columnIndex}"]`);
            if (!taskInput) {
                console.error('Input field not found for column:', columnIndex);
                return;
            }
            
            const taskText = taskInput.value.trim();
            
            if (taskText === '') {
                taskInput.focus();
                return;
            }

            // Ensure tasks array structure is correct
            if (!Array.isArray(tasks)) {
                tasks = [[], [], []];
            }
            if (!tasks[columnIndex]) {
                tasks[columnIndex] = [];
            }
            if (!Array.isArray(tasks[columnIndex])) {
                tasks[columnIndex] = [];
            }
            
            // Add task to the column
            tasks[columnIndex].push({
                text: taskText,
                completed: false,
                comments: []
            });

            console.log('Tasks after adding:', JSON.stringify(tasks));
            console.log('Column', columnIndex, 'now has', tasks[columnIndex].length, 'tasks');

            // Clear input immediately
            taskInput.value = '';
            
            // Save and render
            saveTasks();
            renderTasks(columnIndex);
            
            // Focus back on input
            taskInput.focus();
        }

        // Function to toggle task completion
        function toggleTask(columnIndex, taskIndex) {
            const wasCompleted = tasks[columnIndex][taskIndex].completed;
            tasks[columnIndex][taskIndex].completed = !tasks[columnIndex][taskIndex].completed;
            
            // Add timestamp when completed, remove when uncompleted
            if (tasks[columnIndex][taskIndex].completed) {
                tasks[columnIndex][taskIndex].completedAt = Date.now();
            } else {
                delete tasks[columnIndex][taskIndex].completedAt;
            }
            
            saveTasks();
            renderTasks(columnIndex);
            
            // Show message if task was just completed (not uncompleted)
            if (!wasCompleted && tasks[columnIndex][taskIndex].completed) {
                showElmoMessage();
            }
        }

        // Function to show Elmo's proud message
        function showElmoMessage() {
            // Remove any existing message
            const existingMessage = document.querySelector('.elmo-message');
            if (existingMessage) {
                existingMessage.remove();
            }
            
            // Get Elmo image position
            const elmoImage = document.querySelector('.elmo-image');
            if (!elmoImage) return;
            
            const elmoRect = elmoImage.getBoundingClientRect();
            
            // Create message element
            const message = document.createElement('div');
            message.className = 'elmo-message';
            message.textContent = 'Elmo\'s proud of you';
            
            // Calculate position relative to Elmo (to the right)
            let msgLeft = elmoRect.right + 20;
            let msgTop = elmoRect.top + elmoRect.height / 2 - 20;
            
            // Add message to DOM first to get its dimensions
            document.body.appendChild(message);
            const msgRect = message.getBoundingClientRect();
            
            // Keep message within visible screen
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            
            // Clamp to viewport
            msgLeft = Math.max(10, Math.min(msgLeft, viewportWidth - msgRect.width - 10));
            msgTop = Math.max(10, Math.min(msgTop, viewportHeight - msgRect.height - 10));
            
            message.style.left = msgLeft + 'px';
            message.style.top = msgTop + 'px';
            
            // Remove message after 5 seconds
            setTimeout(() => {
                message.remove();
            }, 5000);
        }

        // Function to delete a task
        function deleteTask(columnIndex, taskIndex) {
            tasks[columnIndex].splice(taskIndex, 1);
            saveTasks();
            renderTasks(columnIndex);
        }

        // Function to edit a task
        function editTask(columnIndex, taskIndex) {
            const taskItem = document.querySelector(`.task-item[data-column="${columnIndex}"][data-index="${taskIndex}"]`);
            if (!taskItem) return;
            
            const taskTextSpan = taskItem.querySelector('.task-text');
            if (!taskTextSpan) return;
            
            // Check if already in edit mode
            if (taskItem.querySelector('.task-text-edit')) return;
            
            const currentText = tasks[columnIndex][taskIndex].text;
            
            // Get the original height and width of the span
            const originalHeight = taskTextSpan.offsetHeight;
            const originalWidth = taskTextSpan.offsetWidth;
            const computedStyle = window.getComputedStyle(taskTextSpan);
            const lineHeight = parseFloat(computedStyle.lineHeight) || parseFloat(computedStyle.fontSize) * 1.2;
            
            // Calculate number of lines based on text content
            const lines = currentText.split('\n').length;
            const estimatedHeight = Math.max(originalHeight, lines * lineHeight);
            
            // Create textarea field
            const textarea = document.createElement('textarea');
            textarea.className = 'task-text-edit';
            textarea.value = currentText;
            textarea.style.width = originalWidth + 'px';
            textarea.style.minHeight = originalHeight + 'px';
            textarea.style.height = estimatedHeight + 'px';
            
            // Replace span with textarea
            taskTextSpan.replaceWith(textarea);
            textarea.focus();
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);
            
            // Auto-resize textarea as user types
            textarea.addEventListener('input', () => {
                textarea.style.height = 'auto';
                textarea.style.height = Math.max(originalHeight, textarea.scrollHeight) + 'px';
            });
            
            // Automatically save on blur (when clicking outside)
            textarea.addEventListener('blur', () => {
                saveTaskEdit(columnIndex, taskIndex, textarea.value);
            });
            
            // Handle Ctrl+Enter or Cmd+Enter - save and exit edit mode
            textarea.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    textarea.blur(); // This will trigger the blur event and save
                }
                // Handle Escape key - cancel edit
                if (e.key === 'Escape') {
                    cancelTaskEdit(columnIndex, taskIndex);
                }
            });
        }

        // Function to save task edit
        function saveTaskEdit(columnIndex, taskIndex, newText) {
            if (newText.trim() === '') {
                alert('Task text cannot be empty');
                return;
            }
            
            tasks[columnIndex][taskIndex].text = newText.trim();
            saveTasks();
            renderTasks(columnIndex);
        }

        // Function to cancel task edit
        function cancelTaskEdit(columnIndex, taskIndex) {
            renderTasks(columnIndex);
        }

        // Function to render comments
        function renderComments(comments, columnIndex, taskIndex) {
            if (!comments || comments.length === 0) {
                return '<div style="color: #6c757d; font-size: 13px; padding: 10px;">No comments yet</div>';
            }
            return comments.map((comment, index) => {
                // Handle both old string format and new object format
                let content = '';
                if (typeof comment === 'string') {
                    content = linkifyText(comment);
                } else if (comment.type === 'image') {
                    content = `${comment.text ? `<div style="margin-bottom: 8px;">${linkifyText(comment.text)}</div>` : ''}
                        <img src="${comment.image}" alt="Comment image" />`;
                } else {
                    content = linkifyText(comment.text || String(comment));
                }
                
                return `<div class="comment-item">
                    <div class="comment-item-content">${content}</div>
                    <button class="comment-delete-btn" onclick="deleteComment(${columnIndex}, ${taskIndex}, ${index})" title="Delete comment">×</button>
                </div>`;
            }).join('');
        }

        // Function to delete a comment
        function deleteComment(columnIndex, taskIndex, commentIndex) {
            if (confirm('Are you sure you want to delete this comment?')) {
                if (tasks[columnIndex] && tasks[columnIndex][taskIndex] && tasks[columnIndex][taskIndex].comments) {
                    tasks[columnIndex][taskIndex].comments.splice(commentIndex, 1);
                    updateCommentsUI(columnIndex, taskIndex);
                }
            }
        }

        // Function to toggle comments section
        function toggleComments(columnIndex, taskIndex) {
            const commentsSection = document.getElementById(`comments-${columnIndex}-${taskIndex}`);
            const taskItem = document.querySelector(`.task-item[data-column="${columnIndex}"][data-index="${taskIndex}"]`);
            const commentsBtn = taskItem ? taskItem.querySelector('.comments-btn') : null;
            
            if (commentsSection) {
                commentsSection.classList.toggle('show');
                
                // Hide/show comment button based on comments section visibility
                if (commentsBtn) {
                    if (commentsSection.classList.contains('show')) {
                        commentsBtn.style.display = 'none';
                    } else {
                        commentsBtn.style.display = 'inline-flex';
                    }
                }
            }
        }

        // Function to close all comments sections
        function closeAllComments() {
            document.querySelectorAll('.comments-section.show').forEach(section => {
                section.classList.remove('show');
                // Show the comment button again when comments are closed
                const taskItem = section.closest('.task-item');
                if (taskItem) {
                    const commentsBtn = taskItem.querySelector('.comments-btn');
                    if (commentsBtn) {
                        commentsBtn.style.display = 'inline-flex';
                    }
                }
            });
        }

        // Close comments when clicking outside
        document.addEventListener('click', function(e) {
            // Check if click is outside any comments section or comments button
            const clickedCommentsSection = e.target.closest('.comments-section');
            const clickedCommentsBtn = e.target.closest('.comments-btn');
            const clickedCommentItem = e.target.closest('.comment-item');
            const clickedCommentInput = e.target.closest('.comment-input-container');
            
            // If click is not on comments section, button, comment item, or input container, close all comments
            if (!clickedCommentsSection && !clickedCommentsBtn && !clickedCommentItem && !clickedCommentInput) {
                closeAllComments();
            }
        });

        // Function to handle paste image
        function handlePasteImage(e, columnIndex, taskIndex) {
            const items = e.clipboardData.items;
            
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    e.preventDefault();
                    const blob = items[i].getAsFile();
                    const reader = new FileReader();
                    
                    reader.onload = function(event) {
                        const imageData = event.target.result;
                        const commentInput = document.getElementById(`comment-input-${columnIndex}-${taskIndex}`);
                        const commentText = commentInput ? commentInput.value.trim() : '';
                        
                        // Ensure task has comments array
                        if (!tasks[columnIndex][taskIndex].comments) {
                            tasks[columnIndex][taskIndex].comments = [];
                        }
                        
                        // Add image comment (with optional text)
                        tasks[columnIndex][taskIndex].comments.push({
                            type: 'image',
                            image: imageData,
                            text: commentText
                        });
                        
                        // Clear input if text was used
                        if (commentInput) commentInput.value = '';
                        
                        // Update UI
                        updateCommentsUI(columnIndex, taskIndex);
                    };
                    
                    reader.readAsDataURL(blob);
                    return;
                }
            }
        }

        // Function to handle image selection
        function handleImageSelect(columnIndex, taskIndex, event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (!file.type.startsWith('image/')) {
                alert('Please select an image file');
                event.target.value = '';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const imageData = e.target.result;
                const commentInput = document.getElementById(`comment-input-${columnIndex}-${taskIndex}`);
                const commentText = commentInput ? commentInput.value.trim() : '';
                
                // Ensure task has comments array
                if (!tasks[columnIndex][taskIndex].comments) {
                    tasks[columnIndex][taskIndex].comments = [];
                }
                
                // Add image comment (with optional text)
                tasks[columnIndex][taskIndex].comments.push({
                    type: 'image',
                    image: imageData,
                    text: commentText
                });
                
                // Clear inputs
                if (commentInput) commentInput.value = '';
                event.target.value = '';
                
                // Update UI
                updateCommentsUI(columnIndex, taskIndex);
            };
            reader.readAsDataURL(file);
        }

        // Helper function to update comments UI
        function updateCommentsUI(columnIndex, taskIndex) {
            const commentsList = document.getElementById(`comments-list-${columnIndex}-${taskIndex}`);
            if (commentsList) {
                commentsList.innerHTML = renderComments(tasks[columnIndex][taskIndex].comments, columnIndex, taskIndex);
            }
            
            const taskItems = document.querySelectorAll(`.task-item[data-column="${columnIndex}"][data-index="${taskIndex}"]`);
            if (taskItems.length > 0) {
                const commentsBtn = taskItems[0].querySelector('.comments-btn');
                const commentCount = tasks[columnIndex][taskIndex].comments.length;
                if (commentsBtn) {
                    const commentCountBadge = commentCount > 0 ? `<span class="comment-count">${commentCount}</span>` : '';
                    commentsBtn.innerHTML = `💬${commentCountBadge}`;
                }
            }
            
            saveTasks();
        }

        // Function to add a comment
        function addComment(columnIndex, taskIndex) {
            const commentInput = document.getElementById(`comment-input-${columnIndex}-${taskIndex}`);
            if (!commentInput) return;
            
            const commentText = commentInput.value.trim();
            const imageInput = document.getElementById(`comment-image-${columnIndex}-${taskIndex}`);
            
            // Check if there's an image selected
            if (imageInput && imageInput.files && imageInput.files[0]) {
                const file = imageInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageData = e.target.result;
                    
                    // Ensure task has comments array
                    if (!tasks[columnIndex][taskIndex].comments) {
                        tasks[columnIndex][taskIndex].comments = [];
                    }
                    
                    // Add comment with image (and optional text)
                    tasks[columnIndex][taskIndex].comments.push({
                        type: 'image',
                        image: imageData,
                        text: commentText
                    });
                    
                    // Clear inputs
                    commentInput.value = '';
                    imageInput.value = '';
                    
                    // Update UI
                    updateCommentsUI(columnIndex, taskIndex);
                };
                reader.readAsDataURL(file);
            } else if (commentText !== '') {
                // Add text-only comment
                if (!tasks[columnIndex][taskIndex].comments) {
                    tasks[columnIndex][taskIndex].comments = [];
                }
                
                tasks[columnIndex][taskIndex].comments.push(commentText);
                commentInput.value = '';
                updateCommentsUI(columnIndex, taskIndex);
            } else {
                commentInput.focus();
                return;
            }
        }

        // Drag and drop functionality
        let draggedElement = null;
        let draggedColumnIndex = null;
        let draggedTaskIndex = null;

        function handleDragStart(e) {
            const taskItem = e.target.closest('.task-item');
            if (!taskItem) return;
            
            draggedElement = taskItem;
            draggedColumnIndex = parseInt(taskItem.getAttribute('data-column'));
            draggedTaskIndex = parseInt(taskItem.getAttribute('data-index'));
            taskItem.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', taskItem.innerHTML);
        }

        function handleDragEnd(e) {
            const taskItem = e.target.closest('.task-item');
            if (taskItem) {
                taskItem.classList.remove('dragging');
            }
            // Remove drag-over class from all columns
            document.querySelectorAll('.column').forEach(col => {
                col.classList.remove('drag-over');
            });
        }

        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            
            const column = e.currentTarget;
            if (column && column.classList.contains('column')) {
                const targetColumnIndex = parseInt(column.getAttribute('data-column'));
                // Only highlight if dragging to a different column
                if (targetColumnIndex !== draggedColumnIndex) {
                    column.classList.add('drag-over');
                }
            }
            return false;
        }

        function handleDragLeave(e) {
            const column = e.currentTarget;
            if (column && column.classList.contains('column')) {
                column.classList.remove('drag-over');
            }
        }

        function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }

            const targetColumn = e.currentTarget;
            const targetColumnIndex = parseInt(targetColumn.getAttribute('data-column'));
            
            // Remove drag-over class
            targetColumn.classList.remove('drag-over');

            // Handle dropping on a different column
            if (draggedColumnIndex !== null && draggedTaskIndex !== null && targetColumnIndex !== draggedColumnIndex) {
                // Get the task being moved
                const taskToMove = tasks[draggedColumnIndex][draggedTaskIndex];
                
                if (taskToMove) {
                    // Remove task from source column
                    tasks[draggedColumnIndex].splice(draggedTaskIndex, 1);
                    
                    // Add task to target column
                    if (!tasks[targetColumnIndex]) {
                        tasks[targetColumnIndex] = [];
                    }
                    tasks[targetColumnIndex].push(taskToMove);
                    
                    // Save and re-render both columns
                    saveTasks();
                    renderTasks(draggedColumnIndex);
                    renderTasks(targetColumnIndex);
                }
            }

            return false;
        }

        // Handle dragging over a task item (for reordering within column)
        function handleTaskDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            
            const taskItem = e.currentTarget;
            const taskColumnIndex = parseInt(taskItem.getAttribute('data-column'));
            const taskIndex = parseInt(taskItem.getAttribute('data-index'));
            
            // Only show visual feedback if dragging within the same column and not over the same item
            if (draggedColumnIndex !== null && draggedTaskIndex !== null && 
                taskColumnIndex === draggedColumnIndex && taskIndex !== draggedTaskIndex) {
                e.dataTransfer.dropEffect = 'move';
                taskItem.classList.add('drag-over');
            }
            
            return false;
        }

        // Handle leaving a task item during drag
        function handleTaskDragLeave(e) {
            const taskItem = e.currentTarget;
            taskItem.classList.remove('drag-over');
        }

        // Handle dropping on a task item (for reordering within column)
        function handleTaskDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }

            const targetTaskItem = e.currentTarget;
            const targetColumnIndex = parseInt(targetTaskItem.getAttribute('data-column'));
            const targetTaskIndex = parseInt(targetTaskItem.getAttribute('data-index'));
            
            // Remove drag-over class
            targetTaskItem.classList.remove('drag-over');

            // Handle reordering within the same column
            if (draggedColumnIndex !== null && draggedTaskIndex !== null && 
                targetColumnIndex === draggedColumnIndex && targetTaskIndex !== draggedTaskIndex) {
                
                // Get the task being moved
                const taskToMove = tasks[draggedColumnIndex][draggedTaskIndex];
                
                if (taskToMove) {
                    // Remove task from original position
                    const [movedTask] = tasks[draggedColumnIndex].splice(draggedTaskIndex, 1);
                    
                    // Calculate new index (adjust if dragging down)
                    let newIndex = targetTaskIndex;
                    if (draggedTaskIndex < targetTaskIndex) {
                        // Dragging down: after removing, target index shifts down by 1
                        // So we insert at the same target index (which is now the correct position)
                        newIndex = targetTaskIndex;
                    } else {
                        // Dragging up: insert at target position
                        newIndex = targetTaskIndex;
                    }
                    
                    // Insert task at new position
                    tasks[draggedColumnIndex].splice(newIndex, 0, movedTask);
                    
                    // Save and re-render
                    saveTasks();
                    renderTasks(targetColumnIndex);
                }
            }

            return false;
        }

        // Function to save tasks to localStorage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // Event listeners for Enter key on each input
        document.querySelectorAll('.task-input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const columnIndex = parseInt(e.target.getAttribute('data-column'));
                    addTask(columnIndex);
                }
            });
        });

        // Make functions globally available for inline event handlers
        window.editTitle = editTitle;
        window.saveTitleEdit = saveTitleEdit;
        window.cancelTitleEdit = cancelTitleEdit;
        window.toggleTask = toggleTask;
        window.deleteTask = deleteTask;
        window.editTask = editTask;
        window.saveTaskEdit = saveTaskEdit;
        window.cancelTaskEdit = cancelTaskEdit;
        window.addTask = addTask;
        window.toggleComments = toggleComments;
        window.addComment = addComment;
        window.deleteComment = deleteComment;
        window.handleImageSelect = handleImageSelect;
        window.handlePasteImage = handlePasteImage;
        window.handleDragStart = handleDragStart;
        window.handleDragEnd = handleDragEnd;
        window.handleDragOver = handleDragOver;
        window.handleDragLeave = handleDragLeave;
        window.handleDrop = handleDrop;
        window.handleTaskDragOver = handleTaskDragOver;
        window.handleTaskDragLeave = handleTaskDragLeave;
        window.handleTaskDrop = handleTaskDrop;

        // Initial render
        renderAllTasks();
    </script>
</body>
</html>
