<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ccb000 0%, #d4c73d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgb(255, 255, 255);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 1200px;
            max-width: 95vw;
            padding: 29px;
            padding-top: 40px;
            min-height: 400px;
            min-width: 300px;
            box-sizing: border-box;
            overflow: auto;
            resize: both;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .container::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, transparent 50%, #ccb000 50%);
            border-radius: 0 0 20px 0;
            cursor: se-resize;
            pointer-events: none;
        }

        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
            margin-top: 10px;
            position: relative;
            z-index: 100;
        }

        h1 {
            color: #000000;
            text-align: center;
            margin: 0;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            padding: 12px 20px;
            border-radius: 12px;
            transition: box-shadow 0.2s;
            background: #a0a0a0;
            border: 2px solid #666;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        h1:hover {
            box-shadow: 0 6px 20px rgba(204, 176, 0, 0.4);
        }

        .title-edit {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2em;
            font-weight: 600;
            color: #444;
            text-align: center;
            border: 2px solid #ccb000;
            border-radius: 12px;
            padding: 12px 20px;
            background: white;
            outline: none;
            min-width: 150px;
            resize: none;
            line-height: 1.4;
        }

        .elmo-wrapper {
            position: relative;
            display: inline-block;
        }

        .elmo-image {
            width: 110px;
            height: auto;
            min-width: 40px;
            max-width: 300px;
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            cursor: grab;
            user-select: none;
            transition: box-shadow 0.1s ease;
            display: block;
        }

        .elmo-resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, transparent 50%, #ccb000 50%);
            border-radius: 0 0 10px 0;
            cursor: se-resize;
            z-index: 15;
        }

        .elmo-resize-handle:hover {
            background: linear-gradient(135deg, transparent 40%, #b89f00 40%);
        }

        .elmo-image:active {
            cursor: grabbing;
        }

        .elmo-image.dragging {
            opacity: 0.9;
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .elmo-upload-btn {
            position: absolute;
            bottom: 5px;
            left: 5px;
            width: 28px;
            height: 28px;
            background: rgba(204, 176, 0, 0.9);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }

        .elmo-wrapper:hover .elmo-upload-btn,
        .elmo-wrapper:hover .elmo-remove-btn {
            opacity: 1;
        }

        .elmo-upload-btn:hover {
            background: rgba(204, 176, 0, 1);
            transform: scale(1.1);
        }

        .elmo-remove-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 22px;
            height: 22px;
            background: rgba(220, 53, 69, 0.9);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 11;
            line-height: 1;
        }

        .elmo-remove-btn:hover {
            background: rgba(220, 53, 69, 1);
            transform: scale(1.1);
        }

        .elmo-file-input {
            display: none;
        }

        .elmo-wrapper.hidden {
            display: none;
        }

        .restore-elmo-btn {
            background: rgba(204, 176, 0, 0.8);
            border: none;
            padding: 5px 10px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
            transition: all 0.2s;
        }

        .restore-elmo-btn:hover {
            background: rgba(204, 176, 0, 1);
        }

        .restore-elmo-btn.hidden {
            display: none;
        }

        #main-title {
            cursor: grab;
            user-select: none;
        }

        #main-title:active {
            cursor: grabbing;
        }

        #main-title.dragging {
            opacity: 0.8;
        }

        .elmo-message {
            position: fixed;
            background: linear-gradient(135deg, #ccb000 0%, #d4c73d 100%);
            color: #444;
            font-size: 20px;
            font-weight: bold;
            font-family: 'Caveat', cursive;
            padding: 15px 30px;
            border-radius: 20px 20px 20px 0;
            border: 2px solid #666;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            animation: fadeInOut 5s ease-in-out;
            pointer-events: none;
            white-space: nowrap;
        }

        .elmo-message::before {
            content: '';
            position: absolute;
            left: -12px;
            bottom: 8px;
            width: 18px;
            height: 18px;
            background: #d4c73d;
            border: 2px solid #666;
            border-radius: 50%;
            border-top: none;
            border-right: none;
        }

        .elmo-message::after {
            content: '';
            position: absolute;
            left: -20px;
            bottom: 3px;
            width: 12px;
            height: 12px;
            background: #ccb000;
            border: 2px solid #666;
            border-radius: 50%;
            border-top: none;
            border-right: none;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateY(-50%) scale(0.8);
            }
            10% {
                opacity: 1;
                transform: translateY(-50%) scale(1);
            }
            90% {
                opacity: 1;
                transform: translateY(-50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-50%) scale(0.8);
            }
        }

        .export-container {
            position: absolute;
            top: 20px;
            right: 30px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .export-btn {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85em;
            font-weight: 600;
            padding: 8px 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #ccb000 0%, #ddd040 100%);
            color: #444;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .export-btn:hover {
            box-shadow: 0 6px 20px rgba(204, 176, 0, 0.4);
            transform: translateY(-2px);
        }

        @media print {
            body {
                background: white !important;
                padding: 0 !important;
            }
            .container {
                box-shadow: none !important;
                width: 100% !important;
                max-width: 100% !important;
            }
            .export-container,
            .input-container,
            .add-btn,
            .elmo-wrapper,
            .restore-elmo-btn,
            .task-delete,
            .task-checkbox,
            .comments-toggle {
                display: none !important;
            }
            .task {
                break-inside: avoid;
                page-break-inside: avoid;
            }
            .column {
                break-inside: avoid;
            }
        }

        .columns-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 0;
            width: 100%;
            box-sizing: border-box;
            flex: 1;
            min-height: 0;
        }

        /* Tablet breakpoint */
        @media (max-width: 768px) {
            .columns-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .container {
                width: 100%;
                max-width: 100vw;
                margin: 10px;
                padding: 15px;
                padding-top: 30px;
                border-radius: 15px;
                resize: none;
            }
            
            h1 {
                font-size: 1.3em !important;
                padding: 10px 15px !important;
                position: relative !important;
                left: auto !important;
                top: auto !important;
                margin-bottom: 15px;
                cursor: default !important;
            }
            
            .export-container {
                position: relative;
                top: auto;
                right: auto;
                justify-content: center;
                margin-bottom: 15px;
                padding-right: 0;
            }
            
            .export-btn {
                padding: 12px 20px;
                font-size: 1em;
            }
            
            .add-btn {
                padding: 12px 20px;
                font-size: 1em;
                min-height: 48px;
            }
            
            .task-input {
                padding: 14px;
                font-size: 16px;
                min-height: 48px;
            }
            
            .delete-btn {
                width: 36px !important;
                height: 32px !important;
                min-width: 36px !important;
                min-height: 32px !important;
                max-width: 36px !important;
                max-height: 32px !important;
                font-size: 20px !important;
            }
            
            .comments-btn {
                min-width: 44px;
                min-height: 32px;
                font-size: 18px;
            }
            
            .task {
                padding: 12px;
            }
            
            .task-checkbox {
                width: 24px;
                height: 24px;
                min-width: 24px;
            }
            
            .elmo-image-wrapper {
                position: relative !important;
                left: auto !important;
                top: auto !important;
                margin: 10px auto;
                cursor: default !important;
            }
            
            .elmo-resize-handle {
                display: none !important;
            }
            
            .elmo-image-controls {
                opacity: 1;
            }
            
            .elmo-upload-btn,
            .elmo-remove-btn {
                width: 36px;
                height: 36px;
                font-size: 18px;
            }
            
            .elmo-message {
                position: relative !important;
                left: auto !important;
                top: auto !important;
                margin: 10px auto;
                display: block;
                width: fit-content;
            }
            
            .title-container {
                flex-direction: column;
                align-items: center;
            }
        }
        
        /* Phone breakpoint */
        @media (max-width: 480px) {
            body {
                padding: 5px;
            }
            
            .container {
                margin: 5px;
                padding: 10px;
                padding-top: 20px;
                border-radius: 10px;
            }
            
            h1 {
                font-size: 1.1em !important;
                padding: 8px 12px !important;
            }
            
            .column-title {
                font-size: 1.1em;
            }
            
            .export-container {
                flex-direction: column;
                gap: 8px;
            }
            
            .export-btn {
                width: 100%;
                justify-content: center;
            }
            
            .input-container {
                flex-direction: column;
            }
            
            .add-btn {
                width: 100%;
            }
            
            .task-actions {
                gap: 8px;
            }
            
            .comment-input-container {
                flex-direction: column;
            }
            
            .comment-input-container .add-btn {
                width: 100%;
            }
        }

        .column {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            padding: 5px;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .column-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
            box-sizing: border-box;
            min-width: 0;
        }

        .task-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
            min-width: 0;
            box-sizing: border-box;
            background: #444;
            color: white;
        }

        .task-input::placeholder {
            color: #aaa;
        }

        .task-input:focus {
            border-color: #ccb000;
        }

        .add-btn {
            padding: 8px 15px;
            background: linear-gradient(135deg, #ccb000 0%, #d4c73d 100%);
            color: #333;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(204, 176, 0, 0.4);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 5px;
            width: 100%;
            box-sizing: border-box;
            min-width: 0;
            min-height: 0;
        }

        .task-list::-webkit-scrollbar {
            width: 8px;
        }

        .task-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .task-list::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        .task-list::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .task-item {
            background: #e9ecef;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease-out;
            min-width: 0;
            position: relative;
            box-sizing: border-box;
        }

        .task-item-header {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: move;
        }

        .task-item.dragging {
            opacity: 0.5;
        }

        .task-item.drag-over {
            border-top: 3px solid #ccb000;
        }

        .column.drag-over {
            background-color: rgba(255, 215, 0, 0.1);
            border: 2px dashed #ffd700;
            border-radius: 10px;
        }

        .task-item-content {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .task-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
        }

        .comments-btn {
            cursor: pointer;
            font-size: 21px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
            color: #4a7c59;
            position: absolute;
            bottom: 0.1px;
            right: 1px;
            background: transparent;
            border: none;
            border-radius: 4px;
            padding: 0;
            text-align: center;
            height: 30px;
            min-height: 30px;
            max-height: 30px;
            width: 30px;
            min-width: 30px;
            box-sizing: border-box;
            line-height: 1;
            margin-right: 0;
            filter: hue-rotate(90deg) saturate(1.2) brightness(0.9);
        }

        .comments-btn:hover {
            opacity: 0.7;
        }


        .comments-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #dee2e6;
            display: none;
        }

        .comments-section.show {
            display: block;
        }

        .comments-list {
            margin-bottom: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .comment-item {
            background: #ffffff;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 3px solid #ccb000;
            font-size: 14px;
            word-wrap: break-word;
            position: relative;
        }

        .comment-item-content {
            padding-right: 30px;
        }

        .comment-delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #dc3545;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .comment-delete-btn:hover {
            opacity: 1;
        }

        .comment-item img {
            max-width: 100%;
            height: auto;
            border-radius: 2%;
            margin-top: 8px;
            display: block;
            max-height: 300px;
        }

        .comment-file-input {
            display: none;
        }

        .comment-file-label {
            background: #6c757d;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .comment-file-label:hover {
            background: #5a6268;
        }

        .comment-input-container {
            display: flex;
            gap: 8px;
        }

        .comment-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .comment-input:focus {
            border-color: #ccb000;
        }

        .comment-add-btn {
            background: #ccb000;
            color: #333;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .comment-add-btn:hover {
            background: #b8a000;
        }

        .comment-count {
            background: #808080;
            color: white;
            border-radius: 50%;
            padding: 1px 4px;
            font-size: 6px;
            position: absolute;
            top: 2px;
            right: 2px;
            min-width: 10px;
            height: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            border: 1px solid white;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .task-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #6c757d;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #ccb000;
        }

        .task-text {
            flex: 1;
            font-size: 16px;
            color: #333;
            min-width: 0;
            word-wrap: break-word;
            overflow-wrap: break-word;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .task-text:hover {
            background-color: rgba(204, 176, 0, 0.1);
        }

        .task-text a {
            color: #0066cc;
            text-decoration: underline;
            word-break: break-all;
        }

        .task-text a:hover {
            color: #004499;
        }

        .task-item.completed .task-text a {
            color: #6c8eb0;
        }

        .comment-item a {
            color: #0066cc;
            text-decoration: underline;
            word-break: break-all;
        }

        .comment-item a:hover {
            color: #004499;
        }

        .edit-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px !important;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            flex-shrink: 0;
            white-space: nowrap;
            width: 100px !important;
            height: 30px !important;
            min-height: 30px !important;
            max-height: 30px !important;
            box-sizing: border-box !important;
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1;
        }

        .edit-btn:hover {
            background: #218838;
        }

        .task-text-edit {
            flex: 1;
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            font-family: inherit;
            min-width: 0;
            resize: vertical;
            overflow: hidden;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .task-text-edit:focus {
            outline: none;
            border-color: #ccb000;
            box-shadow: 0 0 0 2px rgba(204, 176, 0, 0.2);
        }

        .delete-btn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 4px !important;
            border-radius: 6px;
            cursor: pointer;
            font-size: 20px;
            transition: background 0.3s;
            flex-shrink: 0;
            white-space: nowrap;
            width: 29px !important;
            height: 22px !important;
            min-width: 29px !important;
            max-width: 29px !important;
            min-height: 22px !important;
            max-height: 22px !important;
            box-sizing: border-box !important;
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1;
            position: absolute;
            top: 5px;
            right: 5px;
        }

        .delete-btn:hover {
            background: #e68900;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6c757d;
            grid-column: 1 / -1;
        }

        .empty-state p {
            font-size: 18px;
            margin-top: 10px;
        }

        .week-separator {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            margin: 5px 0;
        }

        .week-separator::before,
        .week-separator::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, #ccb000, transparent);
        }

        .week-separator-text {
            font-size: 12px;
            color: #888;
            font-weight: 500;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

    </style>
